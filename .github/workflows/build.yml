name: Build Streaming Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name=streaming_hub .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Enable Android TV launcher and remote support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<application', '<uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n    <application', 1)
          s = s.replace('<category android:name="android.intent.category.LAUNCHER"/>', '<category android:name="android.intent.category.LAUNCHER"/>\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>')
          s = s.replace('<category android:name="android.intent.category.LAUNCHER" />', '<category android:name="android.intent.category.LAUNCHER" />\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />')
          p.write_text(s, encoding='utf-8')
          assert 'LEANBACK_LAUNCHER' in s, 'Android TV launcher intent not added'
          PY
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: StreamingHub-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=windows --project-name=streaming_hub .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          $exe = Join-Path $release 'streaming_hub.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Windows executable missing: $exe" }
          $script = Join-Path $env:GITHUB_WORKSPACE 'installer\StreamingHub.iss'
          $out = Join-Path $env:GITHUB_WORKSPACE 'installer\output'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DBuildOutputDir=$release" "/O$out" $script
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'StreamingHub-Setup.exe'))) {
            throw 'Installer output missing'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: StreamingHub-Windows-Setup
          path: installer/output/StreamingHub-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: StreamingHub-Windows-Portable
          path: build/windows/x64/runner/Release/**
